[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-saea"
version = "0.1.1"
description = "Auditable LLM-configured surrogate-assisted evolutionary optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openai>=1.68", "python-dotenv>=1.0"]

[project.optional-dependencies]
experiments = ["scipy>=1.10", "matplotlib>=3.7"]
documents = ["reportlab>=4", "pypdf>=4"]

[project.scripts]
llm-saea = "llm_saea.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
